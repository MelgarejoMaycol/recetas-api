name: Temporary dependency repair
on:
  push:
    branches:
      - maintenance/fix-audit-20261021
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'automated dependency lockfile repair')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile with no forced upgrades
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install cleanly
        run: npm ci
      - name: Apply compatible security fixes
        run: npm audit fix --no-fund
      - name: Verify fresh install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Syntax verification
        run: npm run check
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit regenerated dependency files to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "automated dependency lockfile repair"
            git push origin HEAD:maintenance/fix-audit-20261021
          fi
