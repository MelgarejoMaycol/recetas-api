name: Preparar actualización segura de dependencias

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preparar-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actualizar lockfile sin ejecutar scripts de paquetes
        run: |
          npm install 'multer@^2.5.0' --save --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts
      - name: Auditoría de seguridad del lockfile actualizado
        run: npm audit --audit-level=high
      - name: Guardar archivos revisados para incorporación manual
        uses: actions/upload-artifact@v4
        with:
          name: dependencias-corregidas
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 2
