name: Incorporar lockfile auditado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-deps.yml'

permissions:
  contents: write
  actions: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Obtener lockfile de auditoría aprobada
        uses: actions/download-artifact@v4
        with:
          run-id: 41124654191
          name: dependencias-corregidas
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .tmp-deps
      - name: Revisar que solo cambien dependencias permitidas
        run: |
          cp .tmp-deps/package.json ./package.json
          cp .tmp-deps/package-lock.json ./package-lock.json
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies.multer!=='^2.5.0'||l.packages['node_modules/multer'].version!=='2.5.0'||l.packages['node_modules/body-parser'].version!=='2.4.0') process.exit(1)"
          npm audit --audit-level=high
          git diff --stat
      - name: Guardar archivos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): actualizar multer y body-parser vulnerables"
          git push origin HEAD:main
